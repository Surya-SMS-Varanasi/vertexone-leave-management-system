<!DOCTYPE html>
<html th:replace="~{shared/general_layout::layout(~{::title}, ~{::#main}, ~{::#style})}">
	<head>
		<meta charset="UTF-8">
		<title>VertexOne Software Solutions - Home</title>
		<th:block id="style">
			 <!--  --<link rel="stylesheet" th:href="@{/CSS/general/index.css}">-->
			 <style>
			 	.card{
					background:white;
					border:1px solid #E5E7EB;
					border-radius:18px;
				    padding:30px;
				    transition:.35s;
				    box-shadow:0 4px 15px rgba(0,0,0,.05);
				}
				#cont{
					border:none;
				}
			 </style>
			 <script>
			 	$(document).ready(function(){
			 		$("#fgpass").click(function(){
			 			alert("Password has been sent to your registered e-mail address.")
			 		})
			 	})
			 </script>
		</th:block>
		
	</head>
	<body id="main">
		<div class="container my-5">
			<div class="row">
				<div class="col-lg-1"></div>
				<div class="col-lg-10">				
					<div class="card">					
						<div class="row">
							<div class="col-lg-7">								
								<img src="assets/images/adminlogin.png" class="w-100 h-100 " style="border-radius:10px;">								
							</div>
							<div class="col-lg-5">
								<div class="card-body">
			                        <div class="text-center">
			                            <div class="rounded-circle mx-auto mb-2 d-flex justify-content-center align-items-center" style="width:80px;height:80px;background:#eef4ff;">
			                                <i class="bi bi-person fs-1 text-danger"></i>
			                            </div>
			                            <h2 class="fw-bold">Admin Login</h2>
			                            <p class="text-muted">Sign in to continue to the admin panel</p>
			                        </div>
			                        <form class="mt-3" method="post" action="login">
			                            <div class="mb-4">
			                                <label class="form-label fw-semibold">Admin ID</label>
			                                <div class="input-group">
			                                    <span class="input-group-text bg-white">
			                                        <i class="bi bi-person-badge"></i>
			                                    </span>
			                                    <input type="text" class="form-control" name="userid" placeholder="Enter Admin ID">
			                                </div>
			                            </div>
			                            <input type="text" value="Admin" name="type" hidden>
			                            <div class="mb-3">
			                                <div class="d-flex justify-content-between">
			                                    <label class="form-label fw-semibold">Password</label>
			                                    <a href="/fogpassadmin" class="text-decoration-none" id="fgpass">Forgot Password?</a>
			                                </div>
			                                <div class="input-group">
			                                    <span class="input-group-text bg-white">
			                                        <i class="bi bi-lock"></i>
			                                    </span>
			                                    <input type="password" class="form-control" name="password" placeholder="Enter Password">
			                                    <button class="btn btn-outline-secondary" type="button"><i class="bi bi-eye"></i></button>
			                                </div>
			                            </div>
			                            <div class="d-flex justify-content-between align-items-center my-4">
			                                <div class="form-check">
			                                    <input class="form-check-input" type="checkbox" hidden>
			                                    <label class="form-check-label" hidden>Remember Me</label>
			                                </div>
			                            </div>
			                            <button class="btn btn-primary w-100 py-3 rounded-3 fw-bold">
			                                <i class="bi bi-box-arrow-in-right me-2"></i>
			                                Login to the Dashboard
			                            </button>
			                        </form>
			                    </div>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-1"></div>
			</div>
		</div>
 	</body>
</html>
