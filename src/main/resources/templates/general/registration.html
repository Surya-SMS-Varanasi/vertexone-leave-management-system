<!DOCTYPE html>
<html th:replace="~{shared/general_layout::layout(~{::title}, ~{::#main}, ~{::#style})}">
	<head>
		<meta charset="UTF-8">
		<title>VertexOne Software Solutions - Home</title>
		<th:block id="style">
			 <!--  --<link rel="stylesheet" th:href="@{/CSS/general/index.css}">-->
			 <style>
			 	.card{
					background:white;
					border:1px solid #E5E7EB;
					border-radius:18px;
				    padding:30px;
				    transition:.35s;
				    box-shadow:0 4px 15px rgba(0,0,0,.05);
				}
				#cont{
					border:none;
				}
			 </style>
			 <script>
				 $(document).ready(function () {
					 //image viewer
					    $("#profilePic").change(function () {
					        var file = this.files[0];
					        if (file) {
					            var reader = new FileReader();
					            reader.onload = function (e) {
					                $("#previewImage").attr("src", e.target.result);
					            };
					            reader.readAsDataURL(file);
					        }
					    });
					    //Age calculator
					    $("#dob").on("change blur", function () {
					        if ($(this).val() == "") {
					            $("#age").val("");
					            return;
					        }
					        var dob = new Date($(this).val());
					        var today = new Date();
					        var age = today.getFullYear() - dob.getFullYear();
					        var monthDiff = today.getMonth() - dob.getMonth();
					        if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dob.getDate())) {
					            age--;
					        }
					        $("#age").val(age);
					    });
					    //Option Selector
					    
					    $("#grade").change(function () {
					        var grade = $(this).val();
					        $("#designation").empty();
					        $("#designation").append('<option value="">Select Designation</option>');
					        if (grade === "Grade-A") {
					            $("#designation").append('<option value="Project Manager">Project Manager</option>');
					            $("#designation").append('<option value="HR Manager">HR Manager</option>');
					        }
					        else if (grade === "Grade-B") {
					            $("#designation").append('<option value="Team Lead">Team Lead</option>');
					            $("#designation").append('<option value="Senior Software Engineer">Senior Software Engineer</option>');
					        }
					        else if (grade === "Grade-C") {
					            $("#designation").append('<option value="Software Engineer">Software Engineer</option>');
					            $("#designation").append('<option value="QA Engineer">QA Engineer</option>');
					            $("#designation").append('<option value="System Administrator">System Administrator</option>');
					        }
					        else if (grade === "Grade-D") {
					            $("#designation").append('<option value="Trainee Software Engineer">Trainee Software Engineer</option>');
					            $("#designation").append('<option value="Junior Developer">Junior Developer</option>');
					            $("#designation").append('<option value="Intern">Intern</option>');
					        }
					    });
					    
					    //Captcha Refesher
						$("#rimg").click(function(){
							$("#cimage").attr("src","/captcha?"+new Date().getTime());
						})
					});
				 	
			 </script>
		</th:block>
		
	</head>
	<body id="main">
		<div class="container py-5">
			<div class="row">
				<div class="col-lg-12">
					<div class="row g-2">
						<div class="col-lg-4">
							<img src="assets/images/right-regi.png" class="w-100 h-100 " style="border-radius:10px;">
						</div>
						<div class="col-lg-8">
							<div class="card">
								<div class="textheader text-center">
									<h2 class="fw-bold">Employee Registration</h2>
									<p class="text-muted" >Please fill the details <span style=" position:absolute;border-bottom: 3px solid blue; margin-bottom :-20px; margin-left: -45px;">&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;</span>below to create your account</p>
								</div>
								<div class="form">
									<form action="/employee-registration" method="post" enctype="multipart/form-data">
										<div class="row pt-4">									
											<div class="col-lg-6 col-sm-12">
												<div class="row pt-4">									
													<div class="col-lg-12 col-sm-12">
														<label class="form-label">Full Name <span style="color:red;">*</span> </label>
			                        					<input type="text" name="fullname" class="form-control" placeholder="Enter Full Name" required>
													</div>																	
												</div>
												<div class="row pt-4">
													<div class="col-lg-6 col-sm-12">
														<label class="form-label">Date of Birth <span style="color:red;">*</span> </label>
			                        					<input type="date"  class="form-control" id="dob" required>
													</div>	
													<div class="col-lg-6 col-sm-12">
														<label class="form-label">Age</label>
			                        					<input type="number"  name="age" class="form-control" id="age" readonly>
													</div>																				
												</div>
												<div class="row pt-4">									
													<div class="col-lg-12 col-sm-12">
														<label class="form-label">Email Id <span style="color:red;">*</span> </label>
	                        							<input type="email"  name="empid" class="form-control" placeholder="abc@mail.com" required>
													</div>																	
												</div>
											</div>
											
											<div class="col-lg-6 col-sm-12">
												<div class="row pt-4">									
													<label class="form-label">Profile Photo <span style="color:red;">*</span> </label>
												    <div class="card-body text-center">
												<!-- Profile Preview -->
												        <div class="mb-4">
												            <img id="previewImage" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="rounded-circle border border-3 border-primary shadow" style="width:150px;height:150px;object-fit:cover;">
												        </div>													
												        <!-- Upload Button -->
												        <label for="profilePic" class="btn btn-primary px-4">
												            <i class="bi bi-upload me-2"></i>
												            Upload Photo
												        </label>													
												        <input type="file" id="profilePic"  name="profilepic" class="d-none">
												    </div>
												</div>																
											</div>										
										</div>						
									
										<div class="row pt-4">									
											<div class="col-lg-3 col-sm-12">
												<label class="form-label">Gender <span style="color:red;">*</span> </label>
	                        					<select class="form-select"  name="gender" style="font-size:18px;" required>
						                            <option value="" readonly>Select gender</option>
						                            <option value="Male">Male</option>
						                            <option value="Female">Female</option>
						                            <option value="Other">Other</option>
					                        	</select>
											</div>
											<div class="col-lg-3 col-sm-12">
												<label class="form-label">Contact No <span style="color:red;">*</span> </label>
	                        					<input type="number"  name="mobno" class="form-control" placeholder="+91 963542 84548" required>
											</div>
											<div class="col-lg-3 col-sm-12">
												<label class="form-label">Employee Grade <span style="color:red;">*</span> </label>
	                        					<select class="form-select"  name="empgrade" id="grade" style="font-size:18px;" required>
						                            <option value="" readonly>Select Grade</option>
													    <option value="Grade-A">Grade A</option>
													    <option value="Grade-B">Grade B</option>
													    <option value="Grade-C">Grade C</option>
													    <option value="Grade-D">Grade D</option>
					                            </select>
											</div>
											<div class="col-lg-3 col-sm-12">
												<label class="form-label">Designation <span style="color:red;">*</span> </label>
	                        					<select class="form-select" name="designation" id="designation" style="font-size:18px;" required>
						                            <option>Select Grade</option>
					                            </select>
											</div>
																	
										</div>
										
										<div class="row pt-4">
											<div class="col-lg-4 col-sm-12">
												<label class="form-label">Date of Joining <span style="color:red;">*</span> </label>
	                        					<input type="date"  name="joiningdate" class="form-control" required>
											</div>
											<div class="col-lg-4 col-sm-12">
												<label class="form-label">Password <span style="color:red;">*</span> </label>
	                        					<input type="text" name="pass" class="form-control" placeholder="word@0000" required>
											</div>	
											<div class="col-lg-4 col-sm-12">
												<label class="form-label">Confirm Password</label>
	                        					<input type="text" name ="confPass" class="form-control" placeholder="word@0000" required>
											</div>								
										</div>
									
										<div class="row pt-4">
											<div class="col-lg-5 col-sm-5">
												<label class="form-label">Captcha</label>
												<div class="form-control" id="cont">
													<img src="/captcha" style="height:40px; width:150px; border:2px solid green" id="cimage">&emsp;
	                        						<img src="assets/images/refresh.png" style="width:25px; height:25px; cursor:pointer;" id="rimg">
												</div>                        					
											</div>
											<div class="col-lg-4 col-sm-5">
												<label class="form-label">Enter Captcha</label>
	                        					<input type="text" name="captchacode" class="form-control" required>
											</div>	
											<div class="col-lg-3"></div>																			
										</div>
										<div class="row pt-5">									
											<div class="col-sm-12 d-flex justify-content-end">
												<button class="btn btn-secondary btn-send mx-4" type="reset">
													<i class="bi bi-cross  me-2"></i>
													Cancel								
												</button>
												<button class="btn btn-primary btn-send mx-4" type="submit">
													<i class="bi bi-person-add  me-2"></i>
													Register								
												</button>
											</div>									
										</div>
									</form>
								</div>
							</div>
						</div>						
					</div>
				</div>				
			</div>
		</div>
	</body>
	
</html>
