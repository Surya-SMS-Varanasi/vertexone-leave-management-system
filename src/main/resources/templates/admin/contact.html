<!DOCTYPE html>
<html th:replace="~{shared/admin_layout::layout(~{::title}, ~{::#main}, ~{::#style})}">
	<head>
		<meta charset="UTF-8">
		<title>Admin - Contacts</title>
		<th:block id="style">
			 <style>
			 	.card{
					background: #F8F5FF;
					border:1px solid #E5E7EB;
					border-radius:18px;
				    padding:30px;
				    transition:0.35s;
				    box-shadow:0 4px 15px rgba(0,0,0,.05);
				}
				.card:hover{
					transform: translateY(-10px);
					box-shadow: 0 15px 35px rgba(0,0,0,0.15);
	 			}
	 			.enquiry-card{
				    border:0;
				    border-radius:18px;
				    overflow:hidden;
				    box-shadow:0 10px 25px rgba(0,0,0,.08);
				}				
				.table-header{
				    background:linear-gradient(90deg,#2563eb,#3b82f6);
				}				
				.table-header th{
				    color:#fff;
				    padding:16px;
				    border:none;
				    font-weight:600;
				}				
				.table tbody td{
				    padding:18px 16px;
				    vertical-align:middle;
				}				
				.table tbody tr:nth-child(even){
				    background:#f8fbff;
				}				
				.table tbody tr:hover{
				    background:#eef5ff;
				    transition:.3s;
				}				
				.btn{
				    border-radius:8px;
				}				
				.modal-content{
				    border:none;
				    border-radius:18px;
				}				
				.message-box{
				    background:#f8f9fa;
				    border-left:5px solid#DB2777;
				    padding:18px;
				    border-radius:10px;
				    line-height:1.7;
				}
			 </style>
		</th:block>
	</head>
	<body id="main">
		<div class="container-fluid py-4">
		    <div class="card enquiry-card">		
		        <div class="card-header bg-white border-0 py-4">		
		            <h3 class="fw-bold mb-1"><i class="bi bi-chat-left-text-fill text-primary me-2"></i>Manage Contacts</h3>		
		            <p class="text-muted mb-0">View and manage all visitors contacts.</p>		
		        </div>		
		        <div class="card-body">		
		            <div class="table-responsive">		
		                <table class="table align-middle">		
		                    <thead class="table-header">		
			                    <tr>			
			                        <th>ID</th>
			                        <th>Name</th>
			                        <th>Mobile</th>
			                        <th>Email</th>
			                        <th>Message</th>
			                        <th>Submitted On</th>
			                        <th class="text-center">Action</th>			
			                    </tr>		
		                    </thead>		
		                    <tbody>			
			                    <tr th:each="s,o:${list}">	
			                        <td><span class="badge bg-info text-dark px-3 py-2">CNT10<span th:text="${o.count}"></span></span></td>			
			                        <td><strong th:text="${s.name}">Rahul Sharma</strong></td>			
			                        <td th:text="${s.mobno}">9876543210</td>			
			                        <td th:text="${s.email}">rahul@gmail.com</td>
			                        <td th:text="${s.message}">rahul@gmail.com</td>			
			                        <td th:text="${s.addedon}">28 Jul 2026</td>
			                        <td class="text-center">
			                            <a class="btn btn-sm btn-danger" th:href="@{/delenq(id=${s.conid})}"  onclick="return confirm('Are you sure you want to delete this contact?')"><i class="bi bi-trash"></i></a>			
			                        </td>			
		                    	</tr>
		                    </tbody>		
		                </table>		
		            </div>		
		        </div>		
		    </div>		
		</div>
	</body>
</html>
