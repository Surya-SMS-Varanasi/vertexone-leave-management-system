<!DOCTYPE html>
<html th:replace="~{shared/admin_layout::layout(~{::title}, ~{::#main}, ~{::#style})}">
	<head>
		<meta charset="UTF-8">
		<title>Employee - Change Password</title>
		<th:block id="style">
			 <style>
			 	.card{
					background:#7C3AED;
					border:1px solid #E5E7EB;
					border-radius:18px;
				    padding:30px;
				    transition:0.35s;
				    box-shadow:0 4px 15px rgba(0,0,0,.05);
				}
				.card:hover{
					transform: translateY(-10px);
					box-shadow: 0 15px 35px rgba(0,0,0,0.15);
	 			}
	 			.table-header{
					background:linear-gradient(90deg,#2563EB,#3B82F6);				
				}					
				.table-header th{					
					color:white;
					padding:16px;
					font-weight:600;					
				}					
				.table tbody tr:hover{					
					background:#F4F8FF;					
				}					
				.feedback-box{					
					background:#F8FAFC;
					border-left:5px solid #2563EB;
					padding:15px;
					border-radius:10px;
					margin-top:8px;					
				}					
				.modal-content{					
					border-radius:20px;					
				}					
				.modal-body label{					
					font-size:14px;
					margin-bottom:4px;					
				}					
				.modal-body p{					
					font-weight:500;					
				}
			 </style>
		</th:block>
	</head>
	<body id="main">
		<div class="container-fluid py-4">
		    <div class="card shadow-sm border-0 rounded-4">		
		        <div class="card-header border-1 py-4">		
		            <h3 class="fw-bold mb-1"><i class="bi bi-chat-square-dots-fill text-primary me-2"></i>Manage Feedback</h3>		
		            <p class="text-muted mb-0">View feedback submitted by employees.</p>		
		        </div>		
		        <div class="card-body">		
		            <div class="table-responsive">		
		                <table class="table align-middle">		
		                    <thead class="table-header">		
			                    <tr>		
			                        <th>ID</th>
			                        <th>Employee</th>
			                        <th>Subject</th>
			                        <th>Submitted On</th>
			                        <th class="text-center">Action</th>		
			                    </tr>		
		                    </thead>		
		                    <tbody>		
			                    <tr th:each="f,stat : ${list}">
							        <td th:text="${stat.count}"></td>
							        <td th:text="${f.fullname}"></td>
							        <td th:text="${f.subject}"></td>
							        <td th:text="${f.addedon}"></td>			
			                        <td class="text-center">
			                        	<button class="btn btn-primary btn-sm viewBtn"
										        data-bs-toggle="modal"
										        data-bs-target="#feedbackModal"
										
										        th:data-name="${f.fullname}"
										        th:data-grade="${f.empgrade}"
										        th:data-gender="${f.gender}"
										        th:data-age="${f.age}"
										        th:data-designation="${f.designation}"
										        th:data-mobile="${f.mobno}"
										        th:data-email="${f.empid}"
										        th:data-addedon="${f.addedon}"
										        th:data-subject="${f.subject}"
										        th:data-message="${f.message}"
										        th:data-image="@{'/employee-images/' + ${f.pic_file_name}}">
										
										    <i class="bi bi-eye-fill"></i>
										</button>
			                            <a class="btn btn-danger btn-sm" th:href="@{/deletefeed(id=${f.feedid})}"  onclick="return confirm('Are you sure you want to delete this enquiry?')"><i class="bi bi-trash-fill"></i></a>			
			                        </td>			
			                    </tr>	
		                    </tbody>		
		                </table>		
		            </div>		
		        </div>		
		    </div>		
		</div>
		<!-- Modal section -->
		<div class="modal fade" id="feedbackModal">		
			<div class="modal-dialog modal-xl modal-dialog-centered">		
				<div class="modal-content border-0 rounded-4">		
					<div class="modal-header text-white" style="background:linear-gradient(135deg,#059669,#10B981);">		
						<h4 class="modal-title"><i class="bi bi-person-vcard-fill me-2"></i>Employee Feedback</h4>		
						<button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>					
					</div>		
					<div class="modal-body p-4">					
						<div class="row">					
						<!-- Profile -->					
							<div class="col-lg-3 text-center">					
								<img id="empImage" src="" class="img-fluid rounded-circle shadow" style="width:170px;height:170px;object-fit:cover;">								
								<h5 id="empName" class="mt-3 fw-bold"></h5>								
								<span id="empGrade" class="badge" style="background:#DB2777;"></span>							
							</div>					
							<!-- Details -->							
							<div class="col-lg-9">							
								<div class="row">							
									<div class="col-md-4 mb-3">							
										<label class="fw-bold text-secondary">Email</label>							
										<p id="empEmail"></p>						
									</div>					
									<div class="col-md-4 mb-3">									
										<label class="fw-bold text-secondary">Gender</label>										
										<p id="empGender"></p>									
									</div>
									<div class="col-md-4 mb-3">					
										<label class="fw-bold text-secondary" >Age</label>										
										<p id="empAge"></p>										
									</div>	
									<div class="col-md-4 mb-3">							
										<label class="fw-bold text-secondary">Designation</label>										
										<p id="empDesignation"></p>									
									</div>									
									<div class="col-md-4 mb-3">									
										<label class="fw-bold text-secondary">Mobile</label>										
										<p id="empMobile"></p>								
									</div>										
									<div class="col-md-4 mb-3">									
										<label class="fw-bold text-secondary">Submitted On</label>										
										<p id="empAddedOn"></p>									
									</div>
									<div class="col-md-12 mb-3">									
										<label class="fw-bold text-secondary">Subject</label>							
										<div class="feedback-box">
											<p id="empSubject"></p>
											
										</div>									
									</div>					
								</div>					
							</div>					
						</div>					
						<hr>										
						<div>						
							<label class="fw-bold text-secondary">Feedback</label>							
							<div class="feedback-box">	
								<p id="empMessage"></p>				
							</div>						
						</div>					
					</div>					
					<div class="modal-footer">					
						<button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>					
					</div>					
				</div>					
			</div>					
		</div>	
		<script>
			$(document).ready(function () {
			    $(".viewBtn").click(function () {
			    	alert(this);
			        $("#empName").text($(this).data("name"));
			        $("#empGrade").text($(this).data("grade"));
			        $("#empGender").text($(this).data("gender"));
			        $("#empAge").text($(this).data("age") + " Years");
			        $("#empDesignation").text($(this).data("designation"));
			        $("#empMobile").text($(this).data("mobile"));
			        $("#empEmail").text($(this).data("email"));
			        $("#empAddedOn").text($(this).data("addedon"));
			        $("#empSubject").text($(this).data("subject"));
			        $("#empMessage").text($(this).data("message"));
			        $("#empImage").attr("src", $(this).data("image"));	
			    });
			});
	</script>
		
	</body>
</html>
