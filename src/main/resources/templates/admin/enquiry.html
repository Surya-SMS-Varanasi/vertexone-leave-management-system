<!DOCTYPE html>
<html th:replace="~{shared/admin_layout::layout(~{::title}, ~{::#main}, ~{::#style})}">
	<head>
		<meta charset="UTF-8">
		<title>Admin - Enquiries</title>
		<th:block id="style">
			 <style>
			 	.card{
					background: #F8F5FF;
					border:1px solid #E5E7EB;
					border-radius:18px;
				    padding:30px;
				    transition:0.35s;
				    box-shadow:0 4px 15px rgba(0,0,0,.05);
				}
				.card:hover{
					transform: translateY(-10px);
					box-shadow: 0 15px 35px rgba(0,0,0,0.15);
	 			}
	 			.enquiry-card{
				    border:0;
				    border-radius:18px;
				    overflow:hidden;
				    box-shadow:0 10px 25px rgba(0,0,0,.08);
				}				
				.table-header{
				    background:linear-gradient(90deg,#2563eb,#3b82f6);
				}				
				.table-header th{
				    color:#fff;
				    padding:16px;
				    border:none;
				    font-weight:600;
				}				
				.table tbody td{
				    padding:18px 16px;
				    vertical-align:middle;
				}				
				.table tbody tr:nth-child(even){
				    background:#f8fbff;
				}				
				.table tbody tr:hover{
				    background:#eef5ff;
				    transition:.3s;
				}				
				.btn{
				    border-radius:8px;
				}				
				.modal-content{
				    border:none;
				    border-radius:18px;
				}				
				.message-box{
				    background:#f8f9fa;
				    border-left:5px solid#DB2777;
				    padding:18px;
				    border-radius:10px;
				    line-height:1.7;
				}
			 </style>
		</th:block>
	</head>
	<body id="main">
		<div class="container-fluid py-4">
		    <div class="card enquiry-card">		
		        <div class="card-header bg-white border-0 py-4">		
		            <h3 class="fw-bold mb-1"><i class="bi bi-chat-left-text-fill text-primary me-2"></i>Manage Enquiries</h3>		
		            <p class="text-muted mb-0">View and manage all employee enquiries.</p>		
		        </div>		
		        <div class="card-body">		
		            <div class="table-responsive">		
		                <table class="table align-middle">		
		                    <thead class="table-header">		
			                    <tr>			
			                        <th>ID</th>
			                        <th>Name</th>
			                        <th>Mobile</th>
			                        <th>Email</th>
			                        <th>Submitted On</th>
			                        <th class="text-center">Action</th>			
			                    </tr>		
		                    </thead>		
		                    <tbody>			
			                    <tr th:each="s,o:${list}">	
			                        <td><span class="badge bg-info text-dark px-3 py-2">ENQ10<span th:text="${o.count}"></span></span></td>			
			                        <td><strong th:text="${s.name}">Rahul Sharma</strong></td>			
			                        <td th:text="${s.mobno}">9876543210</td>			
			                        <td th:text="${s.email}">rahul@gmail.com</td>			
			                        <td th:text="${s.addedon}">28 Jul 2026</td>
			                        <td class="text-center">
			                        	<button class="btn btn-sm btn-primary me-2 viewBtn" data-bs-toggle="modal" data-bs-target="#viewModal" th:data-name="${s.name}" th:data-email="${s.email}" th:data-mobile="${s.mobno}" th:data-date="${s.addedon}" th:data-topic="${s.topic}" th:data-message="${s.querymsg}"> <i class="bi bi-eye"></i></button>
			                            <a class="btn btn-sm btn-danger" th:href="@{/delenq(id=${s.enqid})}"  onclick="return confirm('Are you sure you want to delete this enquiry?')"><i class="bi bi-trash"></i></a>			
			                        </td>			
		                    	</tr>
		                    </tbody>		
		                </table>		
		            </div>		
		        </div>		
		    </div>		
		</div>
		<div class="modal fade" id="viewModal">		
		    <div class="modal-dialog modal-lg modal-dialog-centered">		
		        <div class="modal-content">		
		            <div class="modal-header text-white" style="background: linear-gradient(135deg, #E11D48, #F43F5E);">		
		                <h5 class="modal-title"><i class="bi bi-chat-left-text me-2"></i>Enquiry Details</h5>		
		                <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>		
		            </div>		
		            <div class="modal-body">		
		                <div class="row g-2">		
		                    <div class="col-md-4">		
		                        <label class="fw-bold text-secondary">Name</label>		
		                        <p id="mName">Rahul Sharma</p>		
		                    </div>		
		                    <div class="col-md-4">		
		                        <label class="fw-bold text-secondary">Email ID</label>		
		                        <p id="mEmail">rahul@gmail.com</p>		
		                    </div>		
		                    <div class="col-md-4">		
		                        <label class="fw-bold text-secondary">Submitted On</label>		
		                        <p id="mDate">28 Jul 2026</p>		
		                    </div>	
		                    <div class="col-12">		
		                        <label class="fw-bold text-secondary">Subject</label>
		                        <div class="message-box p-0">
		                        	<p class="p-2" id="mTopic">Leave Approval</p>
		                        </div>			                        		
		                    </div>		
		                    <div class="col-12">		
		                        <label class="fw-bold text-secondary">Message</label>		
		                        <div class="message-box">
		                        	<p id="mMessage"></p>	
		                        </div>		
		                    </div>		
		                </div>		
		            </div>		
		            <div class="modal-footer">		
		                <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>		
		            </div>		
		        </div>		
		    </div>		
		</div>
		
		<script>
		$(document).ready(function(){
		    $(".viewBtn").click(function(){
		        $("#mName").text($(this).data("name"));
		        $("#mEmail").text($(this).data("email"));
		        $("#mMobile").text($(this).data("mobile"));
		        $("#mDate").text($(this).data("date"));
		        $("#mTopic").text($(this).data("topic"));
		        $("#mMessage").text($(this).data("message"));
		    });

		});
		</script>
	</body>
</html>
